apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: azure-kv-backend
spec:
  provider:
    azurekv:
      vaultUrl: "https://krebiehl-base-secrets.vault.azure.net/"
      authType: ServicePrincipal
      authSecretRef:
        clientId:
          name: eso-azure-credentials
          key: client-id
          namespace: flux-system
        clientSecret:
          name: eso-azure-credentials
          key: client-secret
          namespace: flux-system
      tenantId: "${azureTenantId}"

---

# Secrets for the video pipeline (Frigate + its MQTT broker) live in their own
# vault so a camera stream token or broker credential is never stored next to
# the infrastructure credentials in krebiehl-base-secrets.
#
# Same service principal as the store above, with the same read-only scope:
# it holds Key Vault Secrets User here, because ExternalSecrets never writes to
# this vault.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: azure-kv-video
spec:
  provider:
    azurekv:
      vaultUrl: "https://krebiehl-video.vault.azure.net/"
      authType: ServicePrincipal
      authSecretRef:
        clientId:
          name: eso-azure-credentials
          key: client-id
          namespace: flux-system
        clientSecret:
          name: eso-azure-credentials
          key: client-secret
          namespace: flux-system
      tenantId: "${azureTenantId}"

---

# Secrets for Vital (the health dashboard) and the Health Auto Export server it
# reads from live in their own vault, so the HAE ingest/read tokens, the
# database passwords and the analyst's provider keys are never stored beside
# the infrastructure credentials in krebiehl-base-secrets.
#
# Same service principal and the same read-only scope as azure-kv-video: it
# holds Key Vault Secrets User here, because ExternalSecrets never writes to
# this vault.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: azure-kv-vital
spec:
  provider:
    azurekv:
      vaultUrl: "https://krebiehl-vital-app.vault.azure.net/"
      authType: ServicePrincipal
      authSecretRef:
        clientId:
          name: eso-azure-credentials
          key: client-id
          namespace: flux-system
        clientSecret:
          name: eso-azure-credentials
          key: client-secret
          namespace: flux-system
      tenantId: "${azureTenantId}"
