apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: azure-kv-backend
spec:
  provider:
    azurekv:
      vaultUrl: "https://krebiehl-base-secrets.vault.azure.net/"
      authType: ServicePrincipal
      authSecretRef:
        clientId:
          name: eso-azure-credentials
          key: client-id
          namespace: flux-system
        clientSecret:
          name: eso-azure-credentials
          key: client-secret
          namespace: flux-system
      tenantId: "${azureTenantId}"

---

# OpenChoreo requires a ClusterSecretStore literally named "default"
# (ClusterDataPlane.spec.secretStoreRef.name). Same Azure Key Vault as
# azure-kv-backend above; the vault reports ReadWrite, which OpenChoreo's
# PushSecret path needs. Point vaultUrl at a separate vault if OpenChoreo's
# application secrets should be isolated from infrastructure credentials.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: default
spec:
  provider:
    azurekv:
      vaultUrl: "https://krebiehl-base-secrets.vault.azure.net/"
      authType: ServicePrincipal
      authSecretRef:
        clientId:
          name: eso-azure-credentials
          key: client-id
          namespace: flux-system
        clientSecret:
          name: eso-azure-credentials
          key: client-secret
          namespace: flux-system
      tenantId: "${azureTenantId}"
