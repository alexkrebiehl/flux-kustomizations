apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: azure-kv-backend
spec:
  provider:
    azurekv:
      vaultUrl: "https://krebiehl-base-secrets.vault.azure.net/"
      authType: ServicePrincipal
      authSecretRef:
        clientId:
          name: eso-azure-credentials
          key: client-id
          namespace: flux-system
        clientSecret:
          name: eso-azure-credentials
          key: client-secret
          namespace: flux-system
      tenantId: "${azureTenantId}"

---

# OpenChoreo requires a ClusterSecretStore literally named "default"
# (ClusterDataPlane.spec.secretStoreRef.name).
#
# Deliberately a separate vault from krebiehl-base-secrets: OpenChoreo pushes
# application secrets through this store, so its service principal needs write
# access. On the base vault that principal holds only Key Vault Secrets User
# (read); here it holds Key Vault Secrets Officer (read+write), which keeps
# write scope off the vault holding infrastructure credentials.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: default
spec:
  provider:
    azurekv:
      vaultUrl: "https://krebiehl-openchoreo.vault.azure.net/"
      authType: ServicePrincipal
      authSecretRef:
        clientId:
          name: eso-azure-credentials
          key: client-id
          namespace: flux-system
        clientSecret:
          name: eso-azure-credentials
          key: client-secret
          namespace: flux-system
      tenantId: "${azureTenantId}"

---

# Secrets for the video pipeline (Frigate + its MQTT broker) live in their own
# vault so a camera stream token or broker credential is never stored next to
# the infrastructure credentials in krebiehl-base-secrets.
#
# Same service principal as the stores above, but scoped down: it holds only
# Key Vault Secrets User (read) here, because ExternalSecrets never writes to
# this vault - unlike the OpenChoreo store, which needs Secrets Officer.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: azure-kv-video
spec:
  provider:
    azurekv:
      vaultUrl: "https://krebiehl-video.vault.azure.net/"
      authType: ServicePrincipal
      authSecretRef:
        clientId:
          name: eso-azure-credentials
          key: client-id
          namespace: flux-system
        clientSecret:
          name: eso-azure-credentials
          key: client-secret
          namespace: flux-system
      tenantId: "${azureTenantId}"
