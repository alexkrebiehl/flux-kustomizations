apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: plex
  namespace: flux-system
spec:
  interval: 10m
  path: ./base/plex
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-kustomizations
  dependsOn:
    - name: proxmox-csi-plugin
    - name: cert-manager
    - name: traefik
    # Plex requests devic.es/dri for hardware transcoding; without the plugin the
    # pod sits Pending on "Insufficient devic.es/dri" with nothing naming the cause.
    - name: generic-device-plugin
