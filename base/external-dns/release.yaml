apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
  namespace: external-dns
spec:
  interval: 15m
  chart:
    spec:
      chart: external-dns
      version: "1.24.0"
      sourceRef:
        kind: HelmRepository
        name: external-dns
        namespace: external-dns
      interval: 1h
  values:
    provider: rfc2136
    policy: sync
    domainFilters:
      - krebiehl.com
    extraArgs:
      - --txt-owner-id=${clusterName}
      - --rfc2136-host=172.21.21.21
      - --rfc2136-port=53
      - --rfc2136-zone=krebiehl.com
      - --rfc2136-tsig-secret-alg=hmac-sha512
      - --rfc2136-tsig-keyname=krebiehl.com.
      - --rfc2136-min-ttl=0s
      # Read the zone back over AXFR (TSIG-signed with the same key). Without
      # it external-dns can't see existing records, so policy: sync never
      # deletes anything: removed apps leave their A/TXT records behind and
      # every record is re-sent each interval. (Was --rfc2136-tsig-axfr,
      # deprecated in v0.22; AXFR is still TSIG-signed unless
      # --rfc2136-axfr-insecure is set.)
      - --rfc2136-axfr
      # TEMPORARY: v0.22 dropped the external-dns.alpha.kubernetes.io/
      # annotation prefix. Keep reading it until the LoadBalancer Services in
      # flux-kustomizations-internal move to external-dns.kubernetes.io/,
      # otherwise policy: sync deletes their records. Remove after that.
      - --enable-legacy-annotation-prefix
    env:
      - name: EXTERNAL_DNS_RFC2136_TSIG_SECRET
        valueFrom:
          secretKeyRef:
            name: external-dns-tsig
            key: rfc2136_tsig_secret
