apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  interval: 15m
  chart:
    spec:
      chart: external-secrets
      version: "2.9.0"
      sourceRef:
        kind: HelmRepository
        name: external-secrets
        namespace: external-secrets
      interval: 1h
  values:
    installCRDs: true
    crds:
      # Transitional: keeps the deprecated v1beta1 API served so the upgrade from
      # 0.9.11 is not ordering-sensitive against the manifest rewrites to v1.
      # Remove once every ExternalSecret/ClusterSecretStore is confirmed on v1.
      unsafeServeV1Beta1: true
