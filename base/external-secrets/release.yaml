apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  interval: 15m
  chart:
    spec:
      chart: external-secrets
      version: "2.9.0"
      sourceRef:
        kind: HelmRepository
        name: external-secrets
        namespace: external-secrets
      interval: 1h
  values:
    installCRDs: true
    crds:
      # Every ExternalSecret and ClusterSecretStore in both repos is on v1 and
      # confirmed synced, so the deprecated API no longer needs to be served.
      # Note the CRDs still declare v1beta1 (unserved) and status.storedVersions
      # still lists it, so objects written before the migration remain readable.
      unsafeServeV1Beta1: false
