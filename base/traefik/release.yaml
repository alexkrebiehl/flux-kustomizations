apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 15m
  chart:
    spec:
      chart: traefik
      version: "43.0.0"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: traefik
      interval: 1h
  # Helm never upgrades CRDs on its own. The chart's crds/ holds only
  # traefik.io and hub.traefik.io CRDs (no Gateway API ones; base/gateway-api
  # owns those), so letting Flux replace them is safe and keeps them in step
  # with the proxy version.
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    deployment:
      replicas: 1

    # Chart 40+ takes Service fields under service.spec.
    service:
      spec:
        type: LoadBalancer

    ports:
      web:
        port: 80
        exposedPort: 80
      websecure:
        port: 443
        exposedPort: 443
        http3:
          enabled: true

    ingressRoute:
      dashboard:
        enabled: true

    providers:
      kubernetesCRD:
        enabled: true
        allowCrossNamespace: true
        # Collision-safe names for CRD-generated routers/middlewares/services
        # (v3.8 warns when unset). References to CRD objects from Ingress
        # annotations must use namespace_name@kubernetescrd, not
        # namespace-name@kubernetescrd: a reference in the old form is not
        # resolved and its router is not created.
        safeNaming: true
      kubernetesIngress:
        enabled: true
        publishedService:
          enabled: true

    # Chart 41 split logs.general/logs.access into log/accessLog.
    log:
      level: INFO
    accessLog:
      enabled: true
