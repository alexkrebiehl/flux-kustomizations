apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 15m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "81.5.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: monitoring
      interval: 1h
  values:
    # DISABLE for lightweight setup
    nodeExporter:
      enabled: false

    # Talos does not expose these control-plane components for scraping, so the
    # chart's Services/ServiceMonitors for them can never succeed. Left enabled
    # they produce 10 permanently-down targets, which makes TargetDown fire
    # forever. Disabling the scrape config is the fix; the matching defaultRules
    # groups are already off below.
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false
    kubeEtcd:
      enabled: false

    # Alertmanager -> self-hosted ntfy (base/ntfy)
    alertmanager:
      enabled: true

      ingress:
        enabled: true
        ingressClassName: traefik
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-production
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
        hosts:
          - alertmanager.krebiehl.com
        paths:
          - /
        tls:
          - secretName: alertmanager-tls
            hosts:
              - alertmanager.krebiehl.com

      alertmanagerSpec:
        # Without this the chart derives "http://alertmanager.krebiehl.com/" from the
        # ingress host, which breaks silence links behind Traefik's TLS termination.
        externalUrl: "https://alertmanager.krebiehl.com"
        retention: 120h
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: proxmox-zpool
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 2Gi

      config:
        global:
          resolve_timeout: 5m
        route:
          group_by: ["alertname", "namespace"]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 12h
          receiver: ntfy
          routes:
            # Watchdog fires continuously by design as a dead-man's switch; drop it.
            - receiver: "null"
              matchers:
                - alertname = "Watchdog"
            - receiver: "null"
              matchers:
                - alertname = "InfoInhibitor"
            - receiver: ntfy-critical
              matchers:
                - severity = "critical"
              repeat_interval: 4h
        inhibit_rules:
          - source_matchers:
              - severity = "critical"
            target_matchers:
              - severity = "warning"
            equal: ["alertname", "namespace"]
        receivers:
          - name: "null"
          # ntfy renders these with its built-in "alertmanager" template.
          # max_alerts caps the payload: ntfy hard-limits a message to 4096 bytes
          # and rejects anything larger with a 400.
          - name: ntfy
            webhook_configs:
              - url: "http://ntfy.ntfy.svc.cluster.local/homelab-alerts?template=alertmanager&priority=default&tags=warning"
                send_resolved: true
                max_alerts: 5
          - name: ntfy-critical
            webhook_configs:
              - url: "http://ntfy.ntfy.svc.cluster.local/homelab-alerts?template=alertmanager&priority=high&tags=rotating_light"
                send_resolved: true
                max_alerts: 5

    # Prometheus configuration
    prometheus:
      enabled: true
      prometheusSpec:
        # Lightweight resource limits
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 2000m
            memory: 2Gi

        # Retention settings
        retention: 15d
        retentionSize: 45GB

        # Storage on proxmox-zpool
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: proxmox-zpool
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 50Gi

        # Increased scrape interval for efficiency
        scrapeInterval: 60s
        evaluationInterval: 60s

        # Scrape all namespaces
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        serviceMonitorSelector: {}
        podMonitorSelector: {}

    # Grafana configuration
    grafana:
      enabled: true

      adminPassword: changeme # TODO: Change this!

      # Configure sidecars to authenticate with Grafana
      sidecar:
        dashboards:
          enabled: true
          defaultFolderName: "General"
          label: grafana_dashboard
          labelValue: "1"
          searchNamespace: ALL
        datasources:
          enabled: true
          label: grafana_datasource
          labelValue: "1"
          searchNamespace: ALL

      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi

      # Storage for dashboards
      persistence:
        enabled: true
        storageClassName: proxmox-zpool
        size: 10Gi
        accessModes:
          - ReadWriteOnce

      # Ingress configuration (matches plex pattern)
      ingress:
        enabled: true
        ingressClassName: traefik
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-production
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
        hosts:
          - grafana.krebiehl.com
        tls:
          - secretName: grafana-tls
            hosts:
              - grafana.krebiehl.com

      # Default K8s dashboards
      defaultDashboardsEnabled: true
      defaultDashboardsTimezone: America/New_York

    # kube-state-metrics (essential for cluster metrics)
    kubeStateMetrics:
      enabled: true
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi

    # Prometheus Operator
    prometheusOperator:
      enabled: true
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi

    # Selective default rules (disable heavy ones)
    defaultRules:
      create: true
      rules:
        alertmanager: true
        etcd: false
        configReloaders: false
        general: true
        k8s: true
        kubeApiserverAvailability: true
        kubeApiserverBurnrate: false
        kubeApiserverHistogram: false
        kubeApiserverSlos: false
        kubeControllerManager: false
        kubelet: true
        kubeProxy: false
        kubePrometheusGeneral: true
        kubePrometheusNodeRecording: false
        kubernetesApps: true
        kubernetesResources: true
        kubernetesStorage: true
        kubernetesSystem: true
        kubeSchedulerAlerting: false
        kubeSchedulerRecording: false
        kubeStateMetrics: true
        network: false
        node: false
        nodeExporterAlerting: false
        nodeExporterRecording: false
        prometheus: true
        prometheusOperator: true
