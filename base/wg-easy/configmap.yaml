apiVersion: v1
kind: ConfigMap
metadata:
  name: wg-easy-startup
  namespace: wg-easy
  labels:
    app.kubernetes.io/name: wg-easy
    app.kubernetes.io/component: vpn
    app.kubernetes.io/managed-by: kustomize
data:
  startup.sh: |
    #!/bin/sh
    set -e

    echo "Starting wg-easy with Talos Linux compatibility..."

    # Talos nodes lack the legacy ip_tables kernel module, so wg-easy's
    # default iptables-based PostUp/PostDown fail and must be replaced with
    # nft-based equivalents (Talos's native netfilter backend). wg-easy writes
    # wg0.conf itself, from its database, on every start -- so the patch cannot
    # be baked into the volume and has to be re-applied each boot.
    #
    # --unhandled-rejections=warn is load-bearing. wg-easy runs `wg-quick up`
    # during startup; on Talos that exits non-zero and surfaces as an unhandled
    # promise rejection, which Node terminates the process for by default. That
    # killed wg-easy ~0.1s in, before the patcher below could run, so the
    # workaround never applied and the container crash-looped. Downgrading it
    # to a warning lets wg-easy survive its own failed attempt and keeps it
    # alive for the patcher to fix the config and bring the interface up.
    node --unhandled-rejections=warn server/index.mjs &
    WGEASY_PID=$!

    # Poll rather than sleeping a fixed interval before starting: the previous
    # version waited 10s and assumed wg0.conf had settled, which raced against
    # wg-easy's own startup. Polling is self-correcting -- if wg-easy rewrites
    # the file later, the next pass re-patches it.
    echo "Starting configuration patcher..."
    while kill -0 $WGEASY_PID 2>/dev/null; do
      if [ -f /etc/wireguard/wg0.conf ]; then
        if ! grep -q "^PostUp = /scripts/wg-nat-up.sh" /etc/wireguard/wg0.conf; then
          echo "Patching wg0.conf to use nft-based NAT..."
          sed -i 's#^PostUp = .*#PostUp = /scripts/wg-nat-up.sh#' /etc/wireguard/wg0.conf
          sed -i 's#^PostDown = .*#PostDown = /scripts/wg-nat-down.sh#' /etc/wireguard/wg0.conf
          # Drop the interface so it is recreated from the patched config.
          wg-quick down wg0 2>/dev/null || true
        fi

        # Bringing the interface up is deliberately NOT tied to having just
        # patched. wg0.conf persists on the volume, so after a restart it can
        # already carry the nft hooks -- nothing to patch, yet the interface
        # still has to be started. Keying "up" off "did we patch" meant that
        # case left wg0 missing with the pod reporting healthy.
        if ! ip link show wg0 >/dev/null 2>&1; then
          echo "Bringing up wg0..."
          if wg-quick up wg0; then
            echo "WireGuard interface started successfully"
          else
            echo "wg-quick up failed; retrying on next pass" >&2
          fi
        fi
      fi
      sleep 2
    done

    # Wait for main process to exit
    wait $WGEASY_PID
  wg-nat-up.sh: |
    #!/bin/sh
    # Sets up MASQUERADE for VPN clients using nft, since Talos nodes don't
    # have the legacy ip_tables kernel module that wg-easy's default
    # iptables-based PostUp relies on.
    set -e

    WG_SUBNET4="172.22.1.0/24"
    WG_SUBNET6="fdcc:ad94:bacf:61a4::cafe:0/112"
    OIF="eth0"

    sysctl -w net.ipv6.conf.all.forwarding=1 >/dev/null 2>&1 || true

    nft add table ip wg_nat 2>/dev/null || true
    nft -- add chain ip wg_nat postrouting { type nat hook postrouting priority 100 \; } 2>/dev/null || true
    nft flush chain ip wg_nat postrouting
    nft add rule ip wg_nat postrouting ip saddr "$WG_SUBNET4" oifname "$OIF" masquerade

    nft add table ip6 wg_nat6 2>/dev/null || true
    nft -- add chain ip6 wg_nat6 postrouting { type nat hook postrouting priority 100 \; } 2>/dev/null || true
    nft flush chain ip6 wg_nat6 postrouting
    nft add rule ip6 wg_nat6 postrouting ip6 saddr "$WG_SUBNET6" oifname "$OIF" masquerade

    echo "wg-nat: masquerade rules applied"
  wg-nat-down.sh: |
    #!/bin/sh
    nft delete table ip wg_nat 2>/dev/null || true
    nft delete table ip6 wg_nat6 2>/dev/null || true
    echo "wg-nat: masquerade rules removed"
