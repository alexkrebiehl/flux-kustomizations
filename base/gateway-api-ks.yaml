# Gateway API CRDs, owned here rather than by the Traefik chart.
#
# Older Traefik charts shipped their own copy under crds/ (v1.1.0 in 32.1.1,
# v1.4.0 in 39.x). Charts 42+ ship none, so the Traefik HelmRelease's
# upgrade.crds: CreateReplace only touches traefik.io/hub.traefik.io CRDs.
# This file stays the single owner of the Gateway API version.
#
# Traefik proxy v3.8+ expects Gateway API v1.7.0 or newer. Bump these CRDs
# before Traefik, not after.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gateway-api
  namespace: flux-system
spec:
  interval: 10m
  path: ./base/gateway-api
  prune: true
  force: true
  sourceRef:
    kind: GitRepository
    name: flux-kustomizations
  dependsOn:
    - name: traefik
