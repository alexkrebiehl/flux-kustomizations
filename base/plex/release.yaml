apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: plex
  namespace: plex
spec:
  interval: 15m
  # Helm's 5m default is too short for this release: the pod pulls the Plex server
  # binary at startup (image tag "public") and the init container can be doing
  # library work, so an upgrade legitimately outruns it. That is what failed on
  # 2026-02-03 with "context deadline exceeded", and with no remediation configured
  # Flux retried zero times and stalled permanently.
  #
  # Helm had already applied that upgrade's manifests before it timed out waiting
  # for readiness, so the cluster was in the right state throughout - only the
  # release record said otherwise. The real cost was that a stalled HelmRelease
  # applies nothing further, so Plex was frozen against any later change.
  timeout: 15m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  chart:
    spec:
      chart: plex-media-server
      version: "1.4.0"
      sourceRef:
        kind: HelmRepository
        name: plex
        namespace: plex
      interval: 1h
  values:
    # Plex configuration
    timezone: America/New_York

    # Environment variables for Plex configuration
    extraEnv:
      ALLOWED_NETWORKS: "172.21.10.0/24"
      TZ: "Etc/New_York"

    # Back on the stock image. A custom build (ghcr.io/alexkrebiehl/plex-amd) added
    # Mesa's AMD VAAPI driver, on the premise that Plex ships none - but Plex 1.43
    # downloads its own AMD driver at runtime and overrides LIBVA_DRIVERS_PATH for
    # the transcoder, so that payload only ever fed Plex's capability probe.
    #
    # Making the probe succeed turned out to be worse than leaving it failing: Plex
    # then starts a hardware job that segfaults in its own bundled ffmpeg and falls
    # back to software, costing a crash and ~0.5s at every playback start. The crash
    # is a Plex bug (-copyts combined with h264_vaapi) and reproduces on a completely
    # unmodified image. See https://github.com/alexkrebiehl/plex-amd/blob/main/PLEX-BUG-REPORT.md
    #
    # "public" carries no Plex binary; the container installs the newest public
    # release at every start, which the daily plex-restart CronJob turns into daily
    # updates.
    image:
      tag: public

    # Storage configuration - use proxmox-zpool storage class
    pms:
      storageClassName: proxmox-zpool
      configStorage: 150Gi

      # NOTE: these MUST live under pms - the chart reads .Values.pms.resources.
      # They sat at the top level of values from initial deployment until
      # 2026-09-07, where the chart never looked, so the StatefulSet ran with
      # resources: {} the whole time.
      # No devic.es/dri request: with the stock image Plex cannot use the GPU at
      # all, so requesting the render node would only pin scheduling for nothing.
      # Re-adding it is a two-line change if the Plex crash is ever fixed.
      #
      # Deliberately no CPU limit. The constitution asks for requests and limits
      # on every workload, but CFS throttling mid-transcode is directly audible
      # as playback stutter, and this is the one workload where that trade is not
      # worth making - all the more so now that transcoding is on the CPU.
      # Requests keep the scheduler honest.
      resources:
        requests:
          cpu: 500m
          memory: 1Gi
        limits:
          memory: 8Gi

    # Service configuration
    service:
      type: LoadBalancer
      port: 32400

    # Init container for library migration
    extraInitContainers:
      - name: library-extractor
        image: alpine:3.19
        command:
          - /bin/sh
          - -c
          - |
            #!/bin/sh
            set -e

            ARCHIVE="/config/plex-library.tar.gz"
            LIBRARY_DIR="/config/Library"

            echo "=== Plex Library Migration Init Container ==="

            # Check if Library directory already exists
            if [ -d "$LIBRARY_DIR" ]; then
              echo "Library directory already exists - skipping extraction"
              exit 0
            fi

            # Check if migration archive exists
            if [ ! -f "$ARCHIVE" ]; then
              echo "No migration archive found at $ARCHIVE - skipping extraction"
              echo "This is normal for first-time startup"
              exit 0
            fi

            echo "Migration archive found: $ARCHIVE"
            echo "Extracting library data..."

            # Extract archive
            tar xzf "$ARCHIVE" -C /config/

            # Verify extraction
            if [ -d "$LIBRARY_DIR" ]; then
              echo "Library extracted successfully!"

              # Remove archive after successful extraction
              rm -f "$ARCHIVE"
              echo "Migration archive removed"
            else
              echo "ERROR: Library directory not found after extraction"
              exit 1
            fi

            echo "=== Migration complete - starting Plex ==="
        volumeMounts:
          - name: pms-config
            mountPath: /config

    # NFS volumes for media library and optimized media
    extraVolumes:
      - name: media
        nfs:
          server: diskstation.krebiehl.com
          path: /volume1/plex
          readOnly: true
      - name: optimized
        nfs:
          server: diskstation.krebiehl.com
          path: /volume1/plex-optimized
          readOnly: false

    extraVolumeMounts:
      - name: media
        mountPath: /media/library
        readOnly: true
      - name: optimized
        mountPath: /media/optimized
        readOnly: false

    # Ingress configuration (optional - update hostname as needed)
    ingress:
      enabled: true
      ingressClassName: traefik
      url: https://plex.krebiehl.com
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-production
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
      hosts:
        - host: plex.krebiehl.com
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: plex-tls
          hosts:
            - plex.krebiehl.com
