apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: plex
  namespace: plex
spec:
  interval: 15m
  # Helm's 5m default is too short for this release: the pod pulls the Plex server
  # binary at startup (image tag "public") and the init container can be doing
  # library work, so an upgrade legitimately outruns it. That is what failed on
  # 2026-02-03 with "context deadline exceeded", and with no remediation configured
  # Flux retried zero times and stalled permanently.
  #
  # Helm had already applied that upgrade's manifests before it timed out waiting
  # for readiness, so the cluster was in the right state throughout - only the
  # release record said otherwise. The real cost was that a stalled HelmRelease
  # applies nothing further, so Plex was frozen against any later change.
  timeout: 15m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  chart:
    spec:
      chart: plex-media-server
      version: "1.4.0"
      sourceRef:
        kind: HelmRepository
        name: plex
        namespace: plex
      interval: 1h
  values:
    # Plex configuration
    timezone: America/New_York

    # Environment variables for Plex configuration
    extraEnv:
      ALLOWED_NETWORKS: "172.21.10.0/24"
      TZ: "Etc/New_York"

    # Our own build of the official image, adding Mesa's AMD VAAPI driver, which
    # upstream ships no version of at all. Built FROM plexinc/pms-docker:public
    # and touching nothing under /usr/lib/plexmediaserver, so Plex still fetches
    # and installs the newest public release at every container start - the daily
    # plex-restart CronJob is what turns that into daily Plex updates.
    # Source: https://github.com/alexkrebiehl/plex-amd
    image:
      registry: ghcr.io
      repository: alexkrebiehl/plex-amd
      tag: latest
      # "latest" is a moving tag, so the nightly restart must actually re-pull it;
      # with IfNotPresent the node would keep serving the layer it first cached.
      pullPolicy: Always

    # Storage configuration - use proxmox-zpool storage class
    pms:
      storageClassName: proxmox-zpool
      configStorage: 150Gi

      # NOTE: these MUST live under pms - the chart reads .Values.pms.resources.
      # They sat at the top level of values from initial deployment until
      # 2026-09-07, where the chart never looked, so the StatefulSet ran with
      # resources: {} the whole time.
      resources:
        requests:
          cpu: 500m
          memory: 1Gi
        limits:
          memory: 8Gi
          # The AMD render node, via generic-device-plugin. This is also what
          # schedules Plex onto talos-cluster-gpu-1: it is the only node
          # advertising the resource, so no nodeSelector is needed.
          #
          # Deliberately no CPU limit. The constitution asks for requests and
          # limits on every workload, but CFS throttling mid-transcode is
          # directly audible as playback stutter, and this is the one workload
          # where that trade is not worth making. Requests keep the scheduler
          # honest.
          devic.es/dri: 1

    # Service configuration
    service:
      type: LoadBalancer
      port: 32400

    # Init container for library migration
    extraInitContainers:
      - name: library-extractor
        image: alpine:3.19
        command:
          - /bin/sh
          - -c
          - |
            #!/bin/sh
            set -e

            ARCHIVE="/config/plex-library.tar.gz"
            LIBRARY_DIR="/config/Library"

            echo "=== Plex Library Migration Init Container ==="

            # Check if Library directory already exists
            if [ -d "$LIBRARY_DIR" ]; then
              echo "Library directory already exists - skipping extraction"
              exit 0
            fi

            # Check if migration archive exists
            if [ ! -f "$ARCHIVE" ]; then
              echo "No migration archive found at $ARCHIVE - skipping extraction"
              echo "This is normal for first-time startup"
              exit 0
            fi

            echo "Migration archive found: $ARCHIVE"
            echo "Extracting library data..."

            # Extract archive
            tar xzf "$ARCHIVE" -C /config/

            # Verify extraction
            if [ -d "$LIBRARY_DIR" ]; then
              echo "Library extracted successfully!"

              # Remove archive after successful extraction
              rm -f "$ARCHIVE"
              echo "Migration archive removed"
            else
              echo "ERROR: Library directory not found after extraction"
              exit 1
            fi

            echo "=== Migration complete - starting Plex ==="
        volumeMounts:
          - name: pms-config
            mountPath: /config

    # NFS volumes for media library and optimized media
    extraVolumes:
      - name: media
        nfs:
          server: diskstation.krebiehl.com
          path: /volume1/plex
          readOnly: true
      - name: optimized
        nfs:
          server: diskstation.krebiehl.com
          path: /volume1/plex-optimized
          readOnly: false

    extraVolumeMounts:
      - name: media
        mountPath: /media/library
        readOnly: true
      - name: optimized
        mountPath: /media/optimized
        readOnly: false

    # Ingress configuration (optional - update hostname as needed)
    ingress:
      enabled: true
      ingressClassName: traefik
      url: https://plex.krebiehl.com
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-production
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
      hosts:
        - host: plex.krebiehl.com
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: plex-tls
          hosts:
            - plex.krebiehl.com
