apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: proxmox-csi-plugin
  namespace: csi-proxmox
spec:
  interval: 15m
  chart:
    spec:
      chart: charts/proxmox-csi-plugin
      sourceRef:
        kind: GitRepository
        name: proxmox-csi-plugin
        namespace: csi-proxmox
      interval: 1h
  values:
    config:
      clusters:
        - url: "${proxmoxUrl}"
          insecure: ${proxmoxInsecure}
          token_id: "${proxmoxTokenId}"
          token_secret: "${proxmoxTokenSecret}"
          region: "${proxmoxRegion}"

    # Tolerations for the CONTROLLER (the chart's top-level key; the node
    # DaemonSet is configured separately).
    #
    # The controller is a single replica and by default tolerates nothing, so
    # it can only run on worker nodes -- the very nodes whose volumes it is
    # responsible for detaching. Draining the worker therefore evicts the
    # controller that would have performed the detach, and with a single-worker
    # cluster there is nowhere else for it to go. This makes a control plane
    # eligible; the affinity below keeps it from being the default choice.
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        effect: NoSchedule

    # Eligible != preferred. With only the toleration the scheduler put the
    # controller on cp-1, which runs at ~97% of its 2340Mi allocatable
    # (kube-apiserver alone is ~1.4Gi and has no limit) -- the worst node in the
    # cluster to add a pod to. A worker is the right home; a control plane is
    # the fallback for when no worker is schedulable, which is the whole point
    # of the toleration. Preferred, not required, so the fallback still works.
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: DoesNotExist

    storageClass:
      - name: proxmox-zpool
        storage: zpool
        reclaimPolicy: Delete
        fstype: ext4
        ssd: true
