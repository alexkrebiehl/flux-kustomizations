apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metallb
  namespace: metallb
spec:
  interval: 15m
  chart:
    spec:
      chart: metallb
      version: "0.16.2"
      sourceRef:
        kind: HelmRepository
        name: metallb
        namespace: metallb
      interval: 1h
  values:
    # L2-only cluster (no BGPPeers): run native mode with no BGP backend.
    # 0.16 makes frr-k8s the default and deprecates FRR mode.
    frrk8s:
      enabled: false
    speaker:
      frr:
        enabled: false
